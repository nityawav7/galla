name: E2E on Vercel deployment

# Vercel sends repository_dispatch events when a deployment finishes. They only
# trigger workflows that exist on the default branch (main).
on:
  repository_dispatch:
    types: ["vercel.deployment.success"]
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL to test
        required: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ github.event.client_payload.environment || 'manual' }})
    runs-on: ubuntu-latest
    env:
      CI: "true"
      PLAYWRIGHT_BASE_URL: ${{ github.event.client_payload.url || inputs.url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.git.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-deployed
          path: playwright-report/
          retention-days: 7
