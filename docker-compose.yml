# Local development database. Production uses Neon (SPEC §7.5).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: galla
      POSTGRES_PASSWORD: galla
      POSTGRES_DB: galla
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the galla_test database used by integration tests.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galla -d galla"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
